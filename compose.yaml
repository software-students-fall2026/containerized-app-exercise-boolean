name: boolean

services:
  mongodb:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web-app:
    build: ./web-app
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DB_NAME: boolean_barcode
    depends_on:
      mongodb:
        condition: service_healthy

  machine-learning-client:
    build: ./machine-learning-client
    environment:
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DB_NAME: boolean_barcode
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
